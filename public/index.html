    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"

    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link
      rel="mask-icon"
      href="/favicon/safari-pinned-tab.svg"

    <!-- Preload fonts to prevent font shatter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload Commissioner font files -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/commissioner/v21/tDaH2o2WnlgI0FNDgduEk4jAhwgumbU1SVfU5BD8OuRL8OstC6KOhgvBYWSFJ-Mgdrgiju6fF8meZm0rk4eF-ZugTuBnsMU.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Commissioner font stylesheet -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Apply Commissioner font to the entire document */
      html,
      body {
        font-family: "Commissioner", sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
        font-display: swap;
      }

      /* Font loading fallback */
      .fonts-loading {
        font-family: sans-serif;
      }

      /* Add a class to indicate when fonts are loaded */
      .fonts-loaded {
        font-family: "Commissioner", sans-serif;
      }
    </style>

    <!-- Font loading script -->
    <script>
      // Add a class to indicate fonts are loading
      document.documentElement.classList.add("fonts-loading");

      // Check if fonts are loaded
      if ("fonts" in document) {
        Promise.all([
          document.fonts.load("1em Commissioner"),
          document.fonts.load("bold 1em Commissioner"),
        ]).then(() => {
          // When fonts are loaded, update the class
          document.documentElement.classList.remove("fonts-loading");
          document.documentElement.classList.add("fonts-loaded");
        });
      } else {
        // Fallback for browsers that don't support the Font Loading API
        document.documentElement.classList.remove("fonts-loading");
        document.documentElement.classList.add("fonts-loaded");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
